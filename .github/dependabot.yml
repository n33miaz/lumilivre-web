version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router*"
          - "@types/react*"
      tooling:
        patterns:
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "typescript"
          - "eslint*"
          - "prettier"
          - "@playwright/*"
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
      frontend-majors:
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
