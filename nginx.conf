# LumiLivre Web — nginx (SPA estática buildada pelo Vite)
# Instalado como /etc/nginx/conf.d/default.conf (server block only).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compressão ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # ---- Security headers ---------------------------------------------------
    # Aplicados incondicionalmente (estáticos, não dependem do ambiente):
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP conservadora — EXEMPLO comentado porque a origem da API varia por
    # deploy (connect-src precisa apontar para o backend real). Ajuste
    # https://api.exemplo.com e descomente:
    #
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.exemplo.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # ---- Assets com hash: cache imutável ------------------------------------
    # Nota nginx: add_header num bloco filho CANCELA os herdados do server —
    # por isso os security headers são repetidos aqui.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ---- SPA fallback ---------------------------------------------------------
    location / {
        try_files $uri /index.html;
    }
}
