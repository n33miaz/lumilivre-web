# LumiLivre Web — nginx (SPA estática buildada pelo Vite)
#
# Instalado como /etc/nginx/templates/default.conf.template: o entrypoint da
# imagem oficial roda envsubst e grava /etc/nginx/conf.d/default.conf na subida
# do container. O Dockerfile limita a substituição a CSP_CONNECT_SRC
# (NGINX_ENVSUBST_FILTER), então $uri e as demais variáveis do nginx sobrevivem.
# Sem essa env, connect-src fica só com 'self' e a SPA não fala com a API — o
# Dockerfile a define a partir do mesmo build arg que o bundle usa.

# Cache-Control resolvido por URI aqui, para que o server block concentre TODOS
# os add_header. Motivo: um add_header dentro de location CANCELA os herdados —
# repetir a lista de segurança em cada location é a duplicação que, mais adiante,
# perde um header sem ninguém notar.
map $uri $lumilivre_cache_control {
    # Documento e arquivos de raiz sem hash: sempre revalidar, senão um deploy
    # novo fica preso no cache do browser apontando para assets que já sumiram.
    default    "no-cache";
    # Assets do Vite têm hash no nome — conteúdo novo é sempre URL nova.
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Compressão ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;
    # Serve os .gz gerados no build (nível 9, uma vez) em vez de comprimir a
    # cada request. A imagem oficial não traz o módulo brotli, por isso só gzip.
    gzip_static on;

    # ---- Security headers ---------------------------------------------------
    add_header Cache-Control $lumilivre_cache_control always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nenhuma tela usa câmera, microfone ou localização; negar de saída evita que
    # um script injetado peça a permissão em nome do domínio.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS — 1 ano. includeSubDomains vale porque não há subdomínio servindo em
    # HTTP puro; se um dia existir, ele precisa de TLS antes deste header subir.
    # Navegador ignora HSTS recebido por HTTP, então o stack local não trava.
    # `preload` fica de fora: entrar na lista dos browsers é praticamente
    # irreversível (remoção leva meses) e exige registro manual em
    # hstspreload.org. Só adicionar quando o dono decidir registrar:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Content-Security-Policy --------------------------------------------
    # Montada em pedaços para caber um comentário por diretiva — o header sai
    # numa linha só. Cada host abaixo foi levantado no código, não por chute.
    set $csp "default-src 'self'";
    # O bundle do Vite é sempre arquivo externo: não existe <script> inline no
    # index.html, então nada de 'unsafe-inline'/'unsafe-eval' aqui.
    set $csp "${csp}; script-src 'self'";
    # CSS próprio + a folha do Google Fonts (index.html: Inter, JetBrains Mono,
    # Plus Jakarta Sans e as Noto CJK/devanágari do fallback de idioma).
    set $csp "${csp}; style-src 'self' https://fonts.googleapis.com";
    # Arquivos das mesmas fontes (fonts.googleapis.com serve o CSS, gstatic os
    # .woff2).
    set $csp "${csp}; font-src 'self' https://fonts.gstatic.com";
    # Capa e avatar são DADO, não código: a URL vem do banco e pode ser Supabase
    # Storage, covers.openlibrary.org (fallback do BookCover e do seed demo),
    # books.google.com (metadados por ISBN) ou o avatar do leitor. Allowlist de
    # host aqui quebraria capa de livro em produção sem ninguém perceber; o que
    # garantimos é HTTPS (nenhum http: passa) + blob:/data: dos previews locais
    # do ImageUploader.
    set $csp "${csp}; img-src 'self' data: blob: https:";
    # Único destino de XHR: a API. Origem injetada pelo build (ver topo).
    set $csp "${csp}; connect-src 'self' ${CSP_CONNECT_SRC}";
    # Nada de <object>/<embed>/<applet> e nenhum iframe na aplicação.
    set $csp "${csp}; object-src 'none'; frame-src 'none'";
    # Fecha as escapatórias clássicas de injeção de markup: reescrever a base de
    # URLs relativas, postar formulário para fora e ser embutido em iframe.
    set $csp "${csp}; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    add_header Content-Security-Policy $csp always;

    # ---- Assets com hash ----------------------------------------------------
    location /assets/ {
        try_files $uri =404;
    }

    # ---- SPA fallback -------------------------------------------------------
    location / {
        try_files $uri /index.html;
    }
}
